/* ── HOOKS ───────────────────────────────────────────── */
function useDraggable(init){
  const [pos,setPos]=useState(init);
  const drag=useRef(false);
  const off=useRef({x:0,y:0});
  const onMD=useCallback(e=>{
    if(e.target.closest('.no-drag'))return;
    drag.current=true;
    off.current={x:e.clientX-pos.x,y:e.clientY-pos.y};
    e.preventDefault();
  },[pos]);
  useEffect(()=>{
    const mv=e=>{if(!drag.current)return;setPos({x:e.clientX-off.current.x,y:e.clientY-off.current.y});};
    const up=()=>{drag.current=false;};
    window.addEventListener('mousemove',mv);
    window.addEventListener('mouseup',up);
    return()=>{window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up);};
  },[]);
  return{pos,onMD,setPos};
}

function useInView(ref,threshold=.18){
  const [vis,setVis]=useState(false);
  useEffect(()=>{
    const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting)setVis(true);},{threshold});
    if(ref.current)obs.observe(ref.current);
    return()=>obs.disconnect();
  },[ref,threshold]);
  return vis;
}

function useWindowSize(){
  const [size,setSize]=useState({w:window.innerWidth,h:window.innerHeight});
  useEffect(()=>{
    let t;
    const fn=()=>{clearTimeout(t);t=setTimeout(()=>setSize({w:window.innerWidth,h:window.innerHeight}),80);};
    window.addEventListener('resize',fn);
    return()=>{window.removeEventListener('resize',fn);clearTimeout(t);};
  },[]);
  return size;
}

function TerminalWindow({onClose}){
  const {pos,onMD}=useDraggable({x:22,y:62});
  const lines=[
    '$ whoami\n→ Riyan Besseghir · PM & Builder · Toulouse',
    '$ cat status.txt\n→ OPEN TO WORK — CDI / Freelance',
    '$ cat superpower.txt\n→ "Je transforme des frictions en produits."',
    '$ cat mindset.txt\n→ Build fast. Learn faster. Ship real things.',
    '$ echo $ambition\n→ Créer des apps qui améliorent la vie des gens.',
  ];
  const [lineIdx,setLineIdx]=useState(0);
  const [charIdx,setCharIdx]=useState(0);
  const [shown,setShown]=useState(['']);
  const [waiting,setWaiting]=useState(false);
  useEffect(()=>{
    const full=lines[lineIdx];
    if(charIdx<=full.length&&!waiting){
      const t=setTimeout(()=>{setShown(prev=>{const a=[...prev];a[a.length-1]=full.slice(0,charIdx);return a;});setCharIdx(c=>c+1);},charIdx===0?400:30);
      return()=>clearTimeout(t);
    }else if(!waiting){
      setWaiting(true);
      const t=setTimeout(()=>{setLineIdx(i=>(i+1)%lines.length);setCharIdx(0);setShown(p=>[...p.slice(-3),'']);setWaiting(false);},1800);
      return()=>clearTimeout(t);
    }
  },[charIdx,lineIdx,waiting]);
  return(
    <MacWindow title="riyan — bash" style={{width:370,left:pos.x,top:pos.y}} onMD={onMD} onClose={onClose}>
      <div style={{padding:'14px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,lineHeight:1.9,minHeight:148,maxHeight:200,overflow:'hidden',color:C.text}}>
        {shown.map((l,i)=>(
          <div key={i}>{l.split('\n').map((part,j)=>(
            <div key={j} style={{color:j===0?C.coral:C.muted}}>
              {part}{i===shown.length-1&&j===l.split('\n').length-1&&<span style={{display:'inline-block',width:7,height:12,background:C.coral,animation:'blink .7s step-end infinite',verticalAlign:'middle',marginLeft:2}}></span>}
            </div>
          ))}</div>
        ))}
      </div>
    </MacWindow>
  );
}

/* ── ZEBRA FOLDER SVG ───────────────────────────────── */
function ZebraFolderSVG({open=false,size=72}){
  const h=Math.round(size*.85);
  return(
    <svg width={size} height={h} viewBox="0 0 72 61" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="folderBodyClip"><rect x="0" y="13" width="72" height="48" rx="6"/></clipPath>
        <clipPath id="folderFrontClip"><rect x="0" y="30" width="72" height="31" rx="6"/></clipPath>
      </defs>
      {/* Body back */}
      <rect x="0" y="13" width="72" height="48" rx="6" fill="#c8960e"/>
      {/* Tab */}
      <path d="M0 13 L0 7 Q0 3 4 3 L24 3 Q28 3 30 7 L34 13 Z" fill="#c8960e"/>
      {/* Zebra stripes clipped to body */}
      <g clipPath="url(#folderBodyClip)">
        {[-18,-6,6,18,30,42,54,66].map((x,i)=>(
          <rect key={i} x={x} y="9" width="8" height="56" rx="2" fill="rgba(0,0,0,.30)" transform={`rotate(-20 ${x+4} 37)`}/>
        ))}
      </g>
      {/* Shine */}
      <rect x="5" y="18" width="22" height="3" rx="1.5" fill="rgba(255,255,255,.3)"/>
      {/* Front flap when open */}
      {open&&(
        <g>
          <rect x="0" y="32" width="72" height="29" rx="6" fill="#b07808" opacity=".85"/>
          <g clipPath="url(#folderFrontClip)">
            {[-18,-6,6,18,30,42,54,66].map((x,i)=>(
              <rect key={i} x={x} y="28" width="8" height="36" rx="2" fill="rgba(0,0,0,.22)" transform={`rotate(-20 ${x+4} 46)`}/>
            ))}
          </g>
        </g>
      )}
    </svg>
  );
}

/* ── GAMES FOLDER ───────────────────────────────────── */

  const peekGames=[
    {label:'LoL',color:'#C89B3C',emoji:'⚔️'},
    {label:'OW',color:'#F99E1A',emoji:'🎮'},
    {label:'P5R',color:'#E42E2E',emoji:'🎭'},
  ];
  const sz=subtle?78:114;
  return(
    <div style={{position:'absolute',left:pos.x,top:pos.y,display:'flex',flexDirection:'column',alignItems:'center',gap:8,cursor:'pointer',zIndex:12,width:subtle?102:140,opacity:subtle&&!hov?.78:1,transition:'opacity .2s'}} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} onClick={onOpen} data-h>
      {/* Peek games on hover */}
      {hov&&(
        <div style={{position:'absolute',bottom:'calc(100% + 10px)',left:'50%',transform:'translateX(-50%)',display:'flex',gap:8,zIndex:20}}>

          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
            <div>
              <div style={{fontSize:40,marginBottom:8}}>{game.emoji}</div>

/* ── 3D FOLDER DESKTOP ICON ─────────────────────────── */
function DesktopFolder3D({label,onOpen,pos,size=100,pulse=false,priority=null,subtle=false}){
  const [hov,setHov]=useState(false);
  const fc=FOLDER_COLORS[label]||'#c4884a';
  const items=FOLDER_ITEMS[label]||[{e:'📁',c:'#888'},{e:'📄',c:'#aaa'},{e:'🗂',c:'#bbb'}];
  const fw=Math.round(size*0.8);
  const fh=Math.round(size*0.62);
  const tabW=Math.round(fw*0.38);
  const tabH=Math.round(fh*0.22);
  const cw=Math.round(size*0.28);
  const ch=Math.round(size*0.36);
  const rotations=[-13,0,13];
  const txs=[-size*0.48,0,size*0.48];
  return(
    <div onClick={onOpen} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{position:'absolute',left:pos.x,top:pos.y,width:size+28,display:'flex',flexDirection:'column',alignItems:'center',gap:5,userSelect:'none',zIndex:10,borderRadius:14,transition:'background .15s',background:hov?`${fc}12`:'transparent',cursor:'pointer',opacity:subtle&&!hov?.75:1,animation:pulse?'iconPulse 1.8s ease-in-out 3':'none'}}>
      {/* Perspective wrapper */}
      <div style={{height:size,width:'100%',display:'flex',alignItems:'center',justifyContent:'center',perspective:'700px',position:'relative'}}>
        {/* Folder group */}
        <div style={{position:'relative',width:fw,height:fh,transformStyle:'preserve-3d'}}>
          {/* Back */}
          <div style={{position:'absolute',inset:0,background:`linear-gradient(160deg,${fc}cc,${fc}99)`,borderRadius:7,boxShadow:`0 4px 18px ${fc}44`,transformOrigin:'bottom center',transform:hov?'rotateX(-16deg)':'rotateX(0deg)',transition:'transform 480ms cubic-bezier(0.34,1.56,0.64,1)',zIndex:1}}/>
          {/* Tab */}
          <div style={{position:'absolute',width:tabW,height:tabH,bottom:fh-2,left:fw*0.06,background:fc,borderTopLeftRadius:6,borderTopRightRadius:6,transformOrigin:'bottom center',transform:hov?'rotateX(-22deg) translateY(-2px)':'rotateX(0deg)',transition:'transform 480ms cubic-bezier(0.34,1.56,0.64,1)',zIndex:1}}/>
          {/* Mini cards fan */}
          {items.slice(0,3).map((item,i)=>(
            <div key={i} style={{
              position:'absolute',
              width:cw,height:ch,
              left:`calc(50% - ${cw/2}px)`,
              bottom:'50%',
              background:`linear-gradient(135deg,${item.c}28,${item.c}12)`,
              border:`1.5px solid ${item.c}55`,
              borderRadius:9,
              display:'flex',alignItems:'center',justifyContent:'center',
              fontSize:cw*0.52,
              boxShadow:`0 6px 18px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.3)`,
              transform:hov
                ?`translateX(${txs[i]}px) translateY(-${size*0.82}px) rotate(${rotations[i]}deg) scale(1)`
                :`translateX(0px) translateY(0px) rotate(0deg) scale(0.3)`,
              opacity:hov?1:0,
              transition:`transform 560ms cubic-bezier(0.34,1.56,0.64,1) ${i*70}ms, opacity 300ms ease ${i*50}ms`,
              zIndex:5-i,
              pointerEvents:'none',
            }}>{item.e}</div>

function BalloonParticle({b}){
  return(
    <div style={{position:'fixed',left:`${b.x}%`,bottom:-80,zIndex:9999,pointerEvents:'none',animation:`balloonFloat ${b.dur}s ease-out ${b.delay}s both`}}>
      <div style={{animation:`balloonSway 1.${Math.floor(b.dur*3)%9+1}s ease-in-out infinite`,transformOrigin:'bottom center'}}>
        <div style={{width:b.sz,height:Math.round(b.sz*1.25),background:`radial-gradient(circle at 35% 30%,${b.c}ee,${b.c}cc)`,borderRadius:'50% 50% 50% 50% / 60% 60% 40% 40%',position:'relative',boxShadow:`0 3px 12px ${b.c}55,inset 3px -3px 0 rgba(0,0,0,.1),inset -2px 3px 0 rgba(255,255,255,.25)`}}>
          <div style={{position:'absolute',top:'14%',left:'20%',width:'24%',height:'18%',background:'rgba(255,255,255,.45)',borderRadius:'50%'}}/>
          <div style={{position:'absolute',bottom:-5,left:'50%',transform:'translateX(-50%)',width:7,height:7,background:b.c,borderRadius:'50%',boxShadow:`0 2px 4px ${b.c}88`}}/>
        </div>
        <div style={{width:1,height:30,background:`${b.c}77`,margin:'0 auto',marginTop:2}}/>
      </div>
    </div>
  );
}
function BalloonEasterEgg(){
  const [balloons,setBalloons]=useState([]);
  const [popped,setPopped]=useState(false);
  const [hov,setHov]=useState(false);
  const colors=['#ff6b4a','#7c5ce7','#00875a','#e8a800','#6366F1','#FF0050','#22C55E','#0A66C2','#E50914','#F99E1A','#c41e3a','#d4a843'];
  const launch=useCallback(()=>{
    if(popped)return;
    setPopped(true);
    const nb=Array.from({length:18},(_,i)=>({
      id:Date.now()+i,
      x:5+Math.random()*90,
      c:colors[i%colors.length],
      sz:26+Math.floor(Math.random()*18),
      dur:2.4+Math.random()*1.8,
      delay:Math.random()*1.1,
    }));
    setBalloons(prev=>[...prev,...nb]);
    setTimeout(()=>{
      setBalloons(prev=>prev.filter(b=>!nb.find(n=>n.id===b.id)));
      setPopped(false);
    },6000);
  },[popped]);
  return(
    <>
      {balloons.map(b=><BalloonParticle key={b.id} b={b}/>)}
      <button data-h onClick={e=>{e.stopPropagation();launch();}}
        onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
        style={{
          position:'fixed',top:18,right:18,zIndex:19,
          width:46,height:46,
          background:hov?'rgba(255,255,255,.96)':'rgba(255,255,255,.82)',
          backdropFilter:'blur(12px)',
          border:`1.5px solid rgba(0,0,0,${hov?.1:.06})`,
          borderRadius:'50%',
          boxShadow:hov?'0 8px 24px rgba(0,0,0,.14)':'0 3px 10px rgba(0,0,0,.08)',
          cursor:'pointer',
          fontSize:22,
          display:'flex',alignItems:'center',justifyContent:'center',
          transition:'all .2s ease',
          transform:hov?'scale(1.12) translateY(-2px)':'scale(1)',
          userSelect:'none',
        }}>
        🎈
      </button>
    </>
  );
}

/* ── SKILL 3D CARD ───────────────────────────────────── */
function Skill3DCard({cat}){
  const ref=useRef(null);
  const [tilt,setTilt]=useState({x:0,y:0,active:false});
  const handleMove=useCallback(e=>{
    if(!ref.current)return;
    const r=ref.current.getBoundingClientRect();
    const dx=(e.clientX-r.left-r.width/2)/(r.width/2);
    const dy=(e.clientY-r.top-r.height/2)/(r.height/2);
    setTilt({x:dy*-5,y:dx*5,active:true});
  },[]);
  const handleLeave=()=>setTilt({x:0,y:0,active:false});
  const s=tilt.active;
  return(
    <div ref={ref} onMouseMove={handleMove} onMouseLeave={handleLeave}
      style={{
        background:'#fff',
        border:`1.5px solid ${s?cat.color+'55':'rgba(0,0,0,.07)'}`,
        borderRadius:16,
        overflow:'hidden',
        cursor:'default',
        minHeight:220,
        display:'flex',
        flexDirection:'column',
        transform:`perspective(1200px) rotateX(${tilt.x}deg) rotateY(${tilt.y}deg) ${s?'scale(1.012)':'scale(1)'}`,
        transition:s?'transform .14s ease':'transform .55s cubic-bezier(.22,.68,0,1.2)',
        transformStyle:'preserve-3d',
        boxShadow:s
          ?`0 16px 40px rgba(0,0,0,.09),0 0 0 1px ${cat.color}22,0 4px 14px ${cat.color}18`
          :'0 1px 6px rgba(0,0,0,.04)',
        willChange:'transform',
      }}>
      {/* Color accent top bar */}
      <div style={{height:3,background:`linear-gradient(90deg,${cat.color},${cat.color}66,transparent)`,flexShrink:0}}/>
      <div style={{padding:'18px 20px',flex:1,display:'flex',flexDirection:'column',gap:14}}>
        {/* Header */}
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div style={{
            width:46,height:46,borderRadius:12,
            background:`linear-gradient(135deg,${cat.color}1a,${cat.color}08)`,
            border:`1px solid ${cat.color}28`,
            display:'flex',alignItems:'center',justifyContent:'center',
            fontSize:24,flexShrink:0,
            transition:'box-shadow .3s',
            boxShadow:s?`0 6px 16px ${cat.color}25`:'none',
          }}>{cat.icon}</div>
          <div style={{flex:1}}>
            <div style={{
              fontFamily:"'Space Grotesk',sans-serif",
              fontSize:17,fontWeight:800,
              letterSpacing:'-.03em',
              color:s?cat.color:'#1a1614',
              lineHeight:1.15,
              marginBottom:3,
              transition:'color .3s',
            }}>{cat.cat}</div>
            <div style={{
              fontFamily:"'JetBrains Mono',monospace",
              fontSize:9,letterSpacing:'.1em',fontWeight:600,
              color:C.muted,textTransform:'uppercase',
            }}>{cat.items.length} compétences</div>
          </div>
        </div>
        {/* Bullet list */}
        <div style={{display:'flex',flexDirection:'column',gap:5,flex:1}}>
          {cat.items.map((item,j)=>(
            <div key={item} style={{
              display:'flex',alignItems:'center',gap:8,
              transition:'all .2s ease',
              transitionDelay:s?`${j*15}ms`:'0ms',
            }}>
              <div style={{
                width:5,height:5,borderRadius:'50%',flexShrink:0,
                background:s?cat.color:`${cat.color}66`,
                transition:'background .3s, transform .3s',
                transform:s?'scale(1.3)':'scale(1)',
              }}/>
              <span style={{
                fontSize:12.5,
                color:s?'#1a1614':'#4a4040',

                transition:'color .2s',
              }}>{item}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

      style={{position:'absolute',left:pos.x,top:pos.y,width:size+24,display:'flex',flexDirection:'column',alignItems:'center',gap:5,userSelect:'none',zIndex:10,borderRadius:14,transition:'background .15s',background:hov?'rgba(255,107,74,.07)':'transparent',opacity:subtle&&!hov?.78:1}}>
      {/* Fixed-height icon wrapper — visual center is at pos.y + size/2 to match SVG path */}
      <div style={{height:size,width:'100%',display:'flex',alignItems:'center',justifyContent:'center',position:'relative'}}>
        <div style={{position:'relative',
          transform:hov?`scale(${(size/100)*1.1}) translateY(-4px)`:`scale(${size/100})`,
          transition:'transform .22s cubic-bezier(.22,.68,0,1.2)',
          filter:hov?'drop-shadow(0 12px 24px rgba(255,107,74,.35))':(isPri?'drop-shadow(0 6px 14px rgba(255,107,74,.28))':'drop-shadow(0 4px 8px rgba(0,0,0,.18))'),
          animation:pulse?'iconPulse 1.8s ease-in-out 3':'none',
          display:'flex',alignItems:'center',justifyContent:'center',lineHeight:1
        }}>
          {children}
          {isPri&&(
            <div style={{position:'absolute',top:-6,right:-6,width:26,height:26,borderRadius:'50%',background:'linear-gradient(135deg,#ff6b4a,#e8553a)',color:'#fff',fontFamily:"'Space Grotesk',sans-serif",fontSize:12,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 12px rgba(255,107,74,.45),0 0 0 2.5px #f8f3ea',border:'1px solid rgba(255,255,255,.6)',zIndex:2}}>
              {priority}
            </div>
          )}
        </div>
      </div>
      <span style={{fontSize:subtle?10:11,color:hov?C.coral:(subtle?C.muted:C.text),fontFamily:"'Inter',sans-serif",fontWeight:hov?700:(isPri?600:500),textAlign:'center',lineHeight:1.2,maxWidth:size+20,wordBreak:'break-word',textShadow:'0 1px 4px rgba(248,243,234,.95)',transition:'color .15s',letterSpacing:'-.01em',marginTop:2}}>
        {label}
      </span>
      {showTip&&(
        <div style={{position:'absolute',bottom:'100%',left:'50%',transform:'translateX(-50%)',marginBottom:8,background:'rgba(26,22,20,.85)',color:'#fff',fontFamily:"'Inter',sans-serif",fontSize:11,fontWeight:500,padding:'5px 12px',borderRadius:8,whiteSpace:'nowrap',pointerEvents:'none',zIndex:99,animation:'fadeUp .2s ease both',boxShadow:'0 4px 12px rgba(0,0,0,.2)'}}>
          {label}
          <div style={{position:'absolute',top:'100%',left:'50%',transform:'translateX(-50%)',width:0,height:0,borderLeft:'5px solid transparent',borderRight:'5px solid transparent',borderTop:'5px solid rgba(26,22,20,.85)'}}/>
        </div>
      )}
    </div>
  );
}

/* ── HERO ────────────────────────────────────────────── */
function HeroSection(){
  const [openProj,setOpenProj]=useState(false);
  const [openProjPro,setOpenProjPro]=useState(false);
  const [openBio,setOpenBio]=useState(false);
  const [openSkills,setOpenSkills]=useState(false);
  const [openImpact,setOpenImpact]=useState(false);
  const [openTimeline,setOpenTimeline]=useState(false);
  const [openFuture,setOpenFuture]=useState(false);
  const [openContact,setOpenContact]=useState(false);
  const [openTikTok,setOpenTikTok]=useState(false);
  const [gamesOpen,setGamesOpen]=useState(false);
  const [lbOpen,setLbOpen]=useState(false);
  const [activeGame,setActiveGame]=useState(null);
  const [activeProject,setActiveProject]=useState(null);
  const [showTerminal,setShowTerminal]=useState(true);
  const [showSpotify,setShowSpotify]=useState(true);
  const [showSticky,setShowSticky]=useState(true);
  const [openRecruteur,setOpenRecruteur]=useState(false);
  const [openChangelog,setOpenChangelog]=useState(false);
  const [pulseActive,setPulseActive]=useState(true);

  // Auto-open Vue Recruteur on landing
  useEffect(()=>{
    const t=setTimeout(()=>setOpenRecruteur(true),900);
    return()=>clearTimeout(t);
  },[]);
  // Stop pulse after 3s
  useEffect(()=>{const t=setTimeout(()=>setPulseActive(false),3000);return()=>clearTimeout(t);},[]);

  const handleInteract=()=>{};

  /* ── Roadmap icon layout — priority zigzag (centered) + optional bottom row ── */
  const {w:VW,h:VH}=useWindowSize();
  const VW_SCALE=Math.max(0.55,Math.min(1,VW/1280));
  const VH_SCALE=Math.max(0.5,Math.min(1,VH/700));
  const SCALE=Math.min(VW_SCALE,VH_SCALE);
  const PRI_SZ=Math.round(100*SCALE);
  const OPT_SZ=Math.round(78*SCALE);
  const EMO_SZ=Math.round(PRI_SZ*0.8);
  const EMO_SZ_OPT=Math.round(OPT_SZ*0.75);

  // 8 PRIORITY icons (recruiter must-see): zigzag treasure-map path — centered vertically
  const PAD_L=Math.round(110*SCALE);
  const PAD_R=Math.round(110*SCALE);
  const ZIG_AMP=Math.round(Math.min(160,VH*0.21)*SCALE);
  // Centre le bloc d'icônes verticalement dans la page
  const TOP_Y=Math.round(Math.max(VH*0.5-(ZIG_AMP+PRI_SZ)*0.5, 70));
  const N_PRI=8;
  const STEP=(VW-PAD_L-PAD_R)/(N_PRI-1);
  const priPos=i=>{
    const x=PAD_L+i*STEP;
    const y=TOP_Y+(i%2===0?0:ZIG_AMP);
    return{x:Math.round(x-(PRI_SZ+24)/2),y:Math.round(y)};
  };
  // Center of each priority icon (for SVG path)
  const priCx=i=>PAD_L+i*STEP;
  const priCy=i=>TOP_Y+(i%2===0?0:ZIG_AMP)+PRI_SZ/2;

  // 3 OPTIONAL icons (curiosités) — bottom row, clamped within viewport
  const OPT_IDEAL=TOP_Y+ZIG_AMP+PRI_SZ+Math.round(60*SCALE);
  const OPT_MAX=VH-OPT_SZ-48;
  const OPT_Y=Math.min(Math.max(OPT_IDEAL,Math.round(VH*0.74)),OPT_MAX);
  const N_OPT=3;
  const OPT_GAP=Math.round(180*SCALE);
  const OPT_TOTAL=(N_OPT-1)*OPT_GAP;
  const OPT_START=(VW-OPT_TOTAL)/2;
  const optPos=i=>{
    const x=OPT_START+i*OPT_GAP;
    return{x:Math.round(x-(OPT_SZ+24)/2),y:OPT_Y};
  };

  // Build dotted SVG path between consecutive priority icons
  const pathD=Array.from({length:N_PRI-1},(_,i)=>{
    const x1=priCx(i),y1=priCy(i),x2=priCx(i+1),y2=priCy(i+1);
    const mx=(x1+x2)/2;
    return `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
  }).join(' ');

  const closedWindows=[
    !showTerminal&&{label:'Terminal',icon:'🖥️',action:()=>setShowTerminal(true)},
    !showSpotify&&{label:'Spotify',icon:'🎵',action:()=>setShowSpotify(true)},
    !showSticky&&{label:'Note',icon:'📌',action:()=>setShowSticky(true)},
  ].filter(Boolean);

  return(
    <section id="hero" style={{height:'100vh',position:'relative',overflow:'hidden',paddingTop:28}} className="hero-desktop" onClick={handleInteract}>
      <MacMenuBar onFutureClick={()=>setOpenFuture(true)}/>

      <div className="hero-bg-name" style={{position:'absolute',top:'48%',left:'50%',transform:'translate(-50%,-50%)',fontFamily:"'Bebas Neue',sans-serif",fontSize:'clamp(140px,22vw,320px)',color:'rgba(255,107,74,.05)',letterSpacing:'.05em',userSelect:'none',pointerEvents:'none',zIndex:0,whiteSpace:'nowrap'}}>RIYAN</div>

      {closedWindows.length>0&&(
        <div style={{position:'absolute',bottom:24,left:'50%',transform:'translateX(-50%)',display:'flex',gap:8,zIndex:30,background:'rgba(255,255,255,.78)',backdropFilter:'blur(20px)',border:`1px solid ${C.border2}`,borderRadius:100,padding:'6px 10px',boxShadow:'0 8px 24px rgba(0,0,0,.08)'}}>
          {closedWindows.map((w,i)=>(
            <button key={i} data-h onClick={w.action} style={{display:'flex',alignItems:'center',gap:5,padding:'4px 12px',background:'none',border:'none',color:C.muted,fontSize:12,cursor:'pointer',borderRadius:100,transition:'background .2s'}} onMouseEnter={e=>e.currentTarget.style.background='rgba(255,107,74,.1)'} onMouseLeave={e=>e.currentTarget.style.background='none'}>
              <span>{w.icon}</span><span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10}}>{w.label}</span>
            </button>
          ))}
        </div>
      )}

      {showTerminal&&<TerminalWindow onClose={()=>setShowTerminal(false)}/>}
      {showSpotify&&<SpotifyWidget onClose={()=>setShowSpotify(false)}/>}
      {showSticky&&<StickyNote onClose={()=>setShowSticky(false)}/>}

      {/* ── ROADMAP — 8 priority icons (zigzag) + 3 optional (bottom) ── */}
      {/* SVG dotted path connecting priority icons (treasure-map style) */}
      <svg style={{position:'absolute',left:0,top:0,width:'100%',height:OPT_Y+OPT_SZ+60,pointerEvents:'none',zIndex:7}} viewBox={`0 0 ${VW} ${OPT_Y+OPT_SZ+60}`} preserveAspectRatio="none">
        <defs>
          <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stopColor="#ff6b4a" stopOpacity="0.7"/>
            <stop offset="50%" stopColor="#ff8a6a" stopOpacity="0.55"/>
            <stop offset="100%" stopColor="#ff6b4a" stopOpacity="0.7"/>
          </linearGradient>
        </defs>
        <path d={pathD} fill="none" stroke="url(#pathGrad)" strokeWidth="3" strokeLinecap="round" strokeDasharray="2 10"/>
        {/* Step circles at each priority node */}
        {Array.from({length:N_PRI},(_,i)=>(
          <circle key={i} cx={priCx(i)} cy={priCy(i)} r="6" fill="#ff6b4a" stroke="#fff" strokeWidth="2.5"/>
        ))}
      </svg>

      {/* "PARCOURS RECRUTEUR" header supprimé */}

      {/* "+POUR ME CONNAITRE" label — start of optional row */}
      <div style={{position:'absolute',left:'50%',top:OPT_Y-52,transform:'translateX(-50%)',zIndex:9,display:'flex',alignItems:'center',gap:10,padding:'7px 14px',background:'rgba(255,255,255,.85)',backdropFilter:'blur(8px)',color:C.muted,borderRadius:100,fontFamily:"'JetBrains Mono',monospace",fontSize:10,fontWeight:600,letterSpacing:'.14em',textTransform:'uppercase',border:`1px solid ${C.border2}`,boxShadow:'0 4px 12px rgba(0,0,0,.05)'}}>
        <span style={{width:18,height:1,background:C.muted,opacity:.5}}/>
        <span>En bonus — pour mieux me connaître</span>
        <span style={{width:18,height:1,background:C.muted,opacity:.5}}/>
      </div>

      {/* PRIORITY ICONS — emoji icons sauf Projets Persos (dossier 3D) */}
      <DesktopIconPro label="Bio" pos={priPos(0)} onOpen={()=>setOpenBio(true)} size={PRI_SZ} pulse={pulseActive} priority={1}>
        <div style={{fontSize:EMO_SZ}}>👤</div>
      </DesktopIconPro>
      <DesktopIconPro label="Expérience Pro" pos={priPos(1)} onOpen={()=>setOpenProjPro(true)} size={PRI_SZ} pulse={pulseActive} priority={2}>
        <div style={{fontSize:EMO_SZ}}>💼</div>
      </DesktopIconPro>
      <DesktopFolder3D label="Projets Persos" pos={priPos(2)} onOpen={()=>setOpenProj(true)} size={PRI_SZ} pulse={pulseActive} priority={3}/>
      <DesktopIconPro label="Skills" pos={priPos(3)} onOpen={()=>setOpenSkills(true)} size={PRI_SZ} pulse={pulseActive} priority={4}>
        <div style={{fontSize:EMO_SZ}}>🎨</div>
      </DesktopIconPro>
      <DesktopIconPro label="Parcours" pos={priPos(4)} onOpen={()=>setOpenTimeline(true)} size={PRI_SZ} pulse={pulseActive} priority={5}>
        <div style={{fontSize:EMO_SZ}}>🛤️</div>
      </DesktopIconPro>
      <DesktopIconPro label="Impact" pos={priPos(5)} onOpen={()=>setOpenImpact(true)} size={PRI_SZ} pulse={pulseActive} priority={6}>
        <div style={{fontSize:EMO_SZ}}>🎯</div>
      </DesktopIconPro>
      <DesktopIconPro label="Mon Futur" pos={priPos(6)} onOpen={()=>setOpenFuture(true)} size={PRI_SZ} pulse={pulseActive} priority={7}>
        <CrystalBallSVG size={Math.round(EMO_SZ*0.92)}/>
      </DesktopIconPro>
      <DesktopIconPro label="Contact" pos={priPos(7)} onOpen={()=>setOpenContact(true)} size={PRI_SZ} pulse={pulseActive} priority={8}>
        <div style={{fontSize:EMO_SZ}}>✉️</div>
      </DesktopIconPro>

      {/* OPTIONAL ICONS — Letterboxd, Jeux, TikTok */}
      <DesktopIconPro label="Letterboxd" pos={optPos(0)} onOpen={()=>setLbOpen(true)} size={OPT_SZ} subtle>
        <div style={{fontSize:EMO_SZ_OPT}}>🎬</div>
      </DesktopIconPro>
      <GamesFolder onOpen={()=>setGamesOpen(true)} pos={optPos(1)} subtle/>
      <DesktopIconPro label="TikTok" pos={optPos(2)} onOpen={()=>setOpenTikTok(true)} size={OPT_SZ} subtle>
        <div style={{fontSize:EMO_SZ_OPT}}>📱</div>
      </DesktopIconPro>

      {/* WINDOWS */}
      {openProj&&<DragWin title="Projets Persos — riyan.world" w={1100} h={820} onClose={()=>setOpenProj(false)}><ProjPersoContent onOpen={p=>setActiveProject(p)}/></DragWin>}
      {openProjPro&&<DragWin title="Expérience Pro — Shippingbo" w={1200} h={820} onClose={()=>setOpenProjPro(false)}><ExpProContent onOpen={p=>setActiveProject(p)}/></DragWin>}
      {openBio&&<DragWin title="Bio — Riyan" w={1180} h={560} onClose={()=>setOpenBio(false)}><BioContent/></DragWin>}
      {openSkills&&<DragWin title="Skills" w={980} h={720} onClose={()=>setOpenSkills(false)}><SkillsContent/></DragWin>}
      {openImpact&&<DragWin title="Impact · Métriques" w={960} h={720} onClose={()=>setOpenImpact(false)}><ImpactContent/></DragWin>}
      {openTimeline&&<DragWin title="Parcours" w={920} h={720} onClose={()=>setOpenTimeline(false)}><TimelineContent/></DragWin>}
      {openFuture&&<DragWin title="Mon Futur" w={1180} h={720} onClose={()=>setOpenFuture(false)}><FutureContent/></DragWin>}
      {openContact&&<DragWin title="Contact — On parle ?" w={1040} h={620} onClose={()=>setOpenContact(false)}><ContactContent/></DragWin>}
      {openTikTok&&<DragWin title="TikTok — @deady" w={920} h={720} onClose={()=>setOpenTikTok(false)}><TikTokContent/></DragWin>}
      {gamesOpen&&<GamesWindow onClose={()=>setGamesOpen(false)} onGameClick={g=>setActiveGame(g)}/>}
      {lbOpen&&<LetterboxdWindow onClose={()=>setLbOpen(false)}/>}
      {activeGame&&<GameSynopsisModal game={activeGame} onClose={()=>setActiveGame(null)}/>}
      {activeProject&&<ProjectModal p={activeProject} onClose={()=>setActiveProject(null)}/>}

      {/* Overlay backdrop quand RecruteurModal est ouvert */}

      {/* Bottom-LEFT summary */}
      <div style={{position:'absolute',bottom:30,left:24,zIndex:18,maxWidth:320,background:'rgba(255,255,255,.88)',backdropFilter:'blur(20px)',border:`1px solid ${C.border}`,borderRadius:18,padding:'18px 20px',boxShadow:'0 12px 32px rgba(0,0,0,.08)'}}>
        <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:C.coral,letterSpacing:'.18em',textTransform:'uppercase',marginBottom:8,display:'flex',alignItems:'center',gap:6}}>
          <span style={{display:'inline-block',width:16,height:1,background:C.coral}}></span>AI Product Manager · 24 ans
        </div>
        <h1 style={{fontFamily:"'Space Grotesk',sans-serif",fontSize:20,fontWeight:800,letterSpacing:'-.03em',lineHeight:1.2,marginBottom:8,color:C.text}}>
          A ship des <span style={{color:C.coral}}>AI-Powered Features</span><br/>en production.
        </h1>

          fontFamily:"'Space Grotesk',sans-serif",fontSize:12,fontWeight:700,
          cursor:'pointer',boxShadow:'0 4px 16px rgba(255,107,74,.4)',
          transition:'all .2s ease',width:'100%',justifyContent:'center'
        }}
        onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-1px)';e.currentTarget.style.boxShadow='0 6px 20px rgba(255,107,74,.5)'}}
        onMouseLeave={e=>{e.currentTarget.style.transform='translateY(0)';e.currentTarget.style.boxShadow='0 4px 16px rgba(255,107,74,.4)'}}>
          ⚡ Mon profil complet →
        </button>
      </div>

      {/* Bottom-RIGHT — CTA impact clairement cliquable */}
      <div style={{position:'absolute',bottom:30,right:24,zIndex:18,display:'flex',flexDirection:'column',gap:10,alignItems:'flex-end'}}>
        <button data-h onClick={e=>{e.stopPropagation();setOpenImpact(true);}} style={{
          display:'flex',alignItems:'center',gap:12,padding:'13px 18px',
          background:'rgba(255,255,255,.92)',backdropFilter:'blur(20px)',

          boxShadow:'0 8px 24px rgba(255,107,74,.18)',cursor:'pointer',
          transition:'all .22s ease',fontFamily:"'Space Grotesk',sans-serif"
        }}
        onMouseEnter={e=>{e.currentTarget.style.transform='translateY(-3px)';e.currentTarget.style.boxShadow='0 14px 36px rgba(255,107,74,.32)';}}
        onMouseLeave={e=>{e.currentTarget.style.transform='translateY(0)';e.currentTarget.style.boxShadow='0 8px 24px rgba(255,107,74,.18)';}}>
          <div style={{display:'flex',flexDirection:'column',alignItems:'flex-start'}}>

}

/* ── DRAG WIN — wraps SectionWindow with internal drag ── */
function DragWin({title,w,h,ix,iy,onClose,children}){
  const rw=Math.min(w,window.innerWidth-40);
  const rh=Math.min(h,window.innerHeight-60);
  const cx=(typeof ix==='number')?ix:Math.max(20,Math.round((window.innerWidth-rw)/2));
  const cy=(typeof iy==='number')?iy:Math.max(40,Math.round((window.innerHeight-rh)/2));
  const {pos,onMD}=useDraggable({x:cx,y:cy});
  return(
    <SectionWindow title={title} style={{width:rw,height:rh,left:pos.x,top:pos.y,zIndex:90}} onMD={onMD} onClose={onClose}>
      {children}
    </SectionWindow>
  );
}

/* ── APP ─────────────────────────────────────────────── */
function App(){
  const [phase,setPhase]=useState('loader'); // loader → welcome → desktop → done
  const [showTooltip,setShowTooltip]=useState(false);
  return(
    <>
      {phase==='loader'&&<Loader onDone={()=>setPhase('welcome')}/>}
      {phase==='welcome'&&<WelcomeFlow onComplete={()=>{setPhase('desktop');setShowTooltip(true);}}/>}
      <div style={{opacity:phase==='desktop'||phase==='done'?1:0,transition:'opacity .8s ease .1s'}}>
        <HeroSection/>
      </div>
      {showTooltip&&<DesktopTooltip onDismiss={()=>{setShowTooltip(false);setPhase('done');}}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

<script>
/* ── PARTICLES (light mode) ─────────────────────────── */
(function(){
  const canvas=document.createElement('canvas');
  canvas.style.cssText='position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.35';
  document.body.appendChild(canvas);
  const ctx=canvas.getContext('2d');
  let W,H,pts=[];
  const resize=()=>{W=canvas.width=innerWidth;H=canvas.height=innerHeight;};
  resize();window.addEventListener('resize',resize);
  const colors=['rgba(255,107,74,','rgba(124,92,231,','rgba(0,135,90,','rgba(232,168,0,'];
  for(let i=0;i<40;i++)pts.push({x:Math.random()*1920,y:Math.random()*1080,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:Math.random()*1.2+.3,c:colors[Math.floor(Math.random()*colors.length)],o:Math.random()*.3+.08});
  (function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;
      if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.c+p.o+')';ctx.fill();
    });
    requestAnimationFrame(draw);
  })();
})();
</script>
