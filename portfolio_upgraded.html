/* ── HOOKS ───────────────────────────────────────────── */
function useDraggable(init){
  const [pos,setPos]=useState(init);
  const drag=useRef(false);
  const off=useRef({x:0,y:0});
  const onMD=useCallback(e=>{
    if(e.target.closest('.no-drag'))return;
    drag.current=true;
    off.current={x:e.clientX-pos.x,y:e.clientY-pos.y};
    e.preventDefault();
  },[pos]);
  useEffect(()=>{
    const mv=e=>{if(!drag.current)return;setPos({x:e.clientX-off.current.x,y:e.clientY-off.current.y});};
    const up=()=>{drag.current=false;};
    window.addEventListener('mousemove',mv);
    window.addEventListener('mouseup',up);
    return()=>{window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up);};
  },[]);
  return{pos,onMD,setPos};
}

function useInView(ref,threshold=.18){
  const [vis,setVis]=useState(false);
  useEffect(()=>{
    const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting)setVis(true);},{threshold});
    if(ref.current)obs.observe(ref.current);
    return()=>obs.disconnect();
  },[ref,threshold]);
  return vis;
}

/* ── DESKTOP TOOLTIP (double-click hint, short) ──────── */
function DesktopTooltip({onDismiss}){
  const [visible,setVisible]=useState(false);
  const [fading,setFading]=useState(false);
  useEffect(()=>{
    const t1=setTimeout(()=>setVisible(true),600);
    const t2=setTimeout(()=>{setFading(true);setTimeout(onDismiss,600)},4000);
    return()=>{clearTimeout(t1);clearTimeout(t2)};
  },[]);
  const dismiss=()=>{setFading(true);setTimeout(onDismiss,400)};
  if(!visible)return null;
  return(
    <div onClick={dismiss} style={{
      position:'fixed',bottom:100,left:'50%',transform:'translateX(-50%)',
      zIndex:7000,background:'rgba(26,22,20,.82)',backdropFilter:'blur(12px)',

function TerminalWindow({onClose}){
  const {pos,onMD}=useDraggable({x:22,y:62});
  const lines=[
    '$ whoami\n→ Riyan Besseghir · PM & Builder · Toulouse',
    '$ cat status.txt\n→ OPEN TO WORK — CDI / Freelance',
    '$ cat superpower.txt\n→ "Je transforme des frictions en produits."',
    '$ cat mindset.txt\n→ Build fast. Learn faster. Ship real things.',
    '$ echo $ambition\n→ Créer des apps qui améliorent la vie des gens.',
  ];
  const [lineIdx,setLineIdx]=useState(0);
  const [charIdx,setCharIdx]=useState(0);
  const [shown,setShown]=useState(['']);
  const [waiting,setWaiting]=useState(false);
  useEffect(()=>{
    const full=lines[lineIdx];
    if(charIdx<=full.length&&!waiting){
      const t=setTimeout(()=>{setShown(prev=>{const a=[...prev];a[a.length-1]=full.slice(0,charIdx);return a;});setCharIdx(c=>c+1);},charIdx===0?400:30);
      return()=>clearTimeout(t);
    }else if(!waiting){
      setWaiting(true);
      const t=setTimeout(()=>{setLineIdx(i=>(i+1)%lines.length);setCharIdx(0);setShown(p=>[...p.slice(-3),'']);setWaiting(false);},1800);
      return()=>clearTimeout(t);
    }
  },[charIdx,lineIdx,waiting]);
  return(
    <MacWindow title="riyan — bash" style={{width:370,left:pos.x,top:pos.y}} onMD={onMD} onClose={onClose}>
      <div style={{padding:'14px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,lineHeight:1.9,minHeight:148,maxHeight:200,overflow:'hidden',color:C.text}}>
        {shown.map((l,i)=>(
          <div key={i}>{l.split('\n').map((part,j)=>(
            <div key={j} style={{color:j===0?C.coral:C.muted}}>
              {part}{i===shown.length-1&&j===l.split('\n').length-1&&<span style={{display:'inline-block',width:7,height:12,background:C.coral,animation:'blink .7s step-end infinite',verticalAlign:'middle',marginLeft:2}}></span>}
            </div>
          ))}</div>
        ))}
      </div>
    </MacWindow>
  );
}

  const {pos,onMD}=useDraggable({x:430,y:62});
  const [idx,setIdx]=useState(0);
  const [play,setPlay]=useState(true);
  const [prog,setProg]=useState(28);
  useEffect(()=>{if(!play)return;const t=setInterval(()=>setProg(p=>{if(p>=100){setIdx(i=>(i+1)%SPOTIFY_TRACKS.length);return 0;}return p+.1;}),200);return()=>clearInterval(t);},[play,idx]);
  const tk=SPOTIFY_TRACKS[idx];
  return(
    <MacWindow title="Music — Spotify" style={{width:268,left:pos.x,top:pos.y}} onMD={onMD} onClose={onClose}>
      <div style={{padding:16}} className="no-drag">
        <div style={{display:'flex',gap:12,alignItems:'center',marginBottom:12}}>
          <div style={{width:52,height:52,borderRadius:10,background:tk.bg,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22}}>{tk.emoji}</div>
          <div style={{overflow:'hidden'}}>
            <div style={{fontSize:12,fontWeight:700,letterSpacing:'-.01em',color:C.text,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:160}}>{tk.title}</div>
            <div style={{fontSize:11,color:C.muted,marginTop:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:160}}>{tk.artist}</div>
          </div>
        </div>
        <div style={{height:3,background:C.border,borderRadius:3,overflow:'hidden',marginBottom:8}}>
          <div style={{height:'100%',width:prog+'%',background:'#1DB954',borderRadius:3,transition:'width .2s'}}></div>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <button data-h onClick={()=>setIdx(i=>(i-1+SPOTIFY_TRACKS.length)%SPOTIFY_TRACKS.length)} style={{background:'none',border:'none',color:C.muted,fontSize:14,padding:'4px 6px'}}>⏮</button>
          <button data-h onClick={()=>setPlay(p=>!p)} style={{background:'#1DB954',border:'none',color:'#fff',fontSize:14,padding:'6px 10px',borderRadius:'50%',width:32,height:32,display:'flex',alignItems:'center',justifyContent:'center'}}>
            {play?'⏸':'▶'}
          </button>
          <button data-h onClick={()=>setIdx(i=>(i+1)%SPOTIFY_TRACKS.length)} style={{background:'none',border:'none',color:C.muted,fontSize:14,padding:'4px 6px'}}>⏭</button>
        </div>
        <div style={{display:'flex',gap:4,marginTop:10,justifyContent:'center'}}>
          {SPOTIFY_TRACKS.map((_,i)=><div key={i} style={{width:i===idx?16:5,height:5,borderRadius:3,background:i===idx?'#1DB954':C.border,transition:'all .3s'}}></div>)}
        </div>
      </div>
    </MacWindow>
  );
}

/* ── ZEBRA FOLDER SVG ───────────────────────────────── */
function ZebraFolderSVG({open=false,size=72}){
  const h=Math.round(size*.85);
  return(
    <svg width={size} height={h} viewBox="0 0 72 61" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="folderBodyClip"><rect x="0" y="13" width="72" height="48" rx="6"/></clipPath>
        <clipPath id="folderFrontClip"><rect x="0" y="30" width="72" height="31" rx="6"/></clipPath>
      </defs>
      {/* Body back */}
      <rect x="0" y="13" width="72" height="48" rx="6" fill="#c8960e"/>
      {/* Tab */}
      <path d="M0 13 L0 7 Q0 3 4 3 L24 3 Q28 3 30 7 L34 13 Z" fill="#c8960e"/>
      {/* Zebra stripes clipped to body */}
      <g clipPath="url(#folderBodyClip)">
        {[-18,-6,6,18,30,42,54,66].map((x,i)=>(
          <rect key={i} x={x} y="9" width="8" height="56" rx="2" fill="rgba(0,0,0,.30)" transform={`rotate(-20 ${x+4} 37)`}/>
        ))}
      </g>
      {/* Shine */}
      <rect x="5" y="18" width="22" height="3" rx="1.5" fill="rgba(255,255,255,.3)"/>
      {/* Front flap when open */}
      {open&&(
        <g>
          <rect x="0" y="32" width="72" height="29" rx="6" fill="#b07808" opacity=".85"/>
          <g clipPath="url(#folderFrontClip)">
            {[-18,-6,6,18,30,42,54,66].map((x,i)=>(
              <rect key={i} x={x} y="28" width="8" height="36" rx="2" fill="rgba(0,0,0,.22)" transform={`rotate(-20 ${x+4} 46)`}/>
            ))}
          </g>
        </g>
      )}
    </svg>
  );
}

/* ── DESKTOP ICON — fixed position, single-click ─────── */
function DesktopIconPro({children,label,onOpen,pos,size=116,pulse=false,priority=null,subtle=false}){
  const [hov,setHov]=useState(false);
  const [showTip,setShowTip]=useState(false);
  let tipTimer=useRef(null);
  const handleMouseEnter=()=>{setHov(true);tipTimer.current=setTimeout(()=>setShowTip(true),500);};
  const handleMouseLeave=()=>{setHov(false);clearTimeout(tipTimer.current);setShowTip(false);};
  const isPri=priority!==null;
  return(
    <div onClick={onOpen}
      onMouseEnter={handleMouseEnter} onMouseLeave={handleMouseLeave}
      style={{position:'absolute',left:pos.x,top:pos.y,width:size+24,display:'flex',flexDirection:'column',alignItems:'center',gap:5,cursor:'pointer',userSelect:'none',zIndex:10,padding:'8px 4px',borderRadius:14,transition:'background .15s',background:hov?'rgba(255,107,74,.07)':'transparent',opacity:subtle&&!hov?.78:1}}>
      <div style={{position:'relative',
        transform:hov?'scale(1.1) translateY(-4px)':'scale(1)',
        transition:'transform .22s cubic-bezier(.22,.68,0,1.2)',
        filter:hov?'drop-shadow(0 12px 24px rgba(255,107,74,.35))':(isPri?'drop-shadow(0 6px 14px rgba(255,107,74,.28))':'drop-shadow(0 4px 8px rgba(0,0,0,.18))'),
        animation:pulse?'iconPulse 1.8s ease-in-out 3':'none'
      }}>
        {children}
        {isPri&&(
          <div style={{position:'absolute',top:-6,right:-6,width:26,height:26,borderRadius:'50%',background:'linear-gradient(135deg,#ff6b4a,#e8553a)',color:'#fff',fontFamily:"'Space Grotesk',sans-serif",fontSize:12,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 12px rgba(255,107,74,.45),0 0 0 2.5px #f8f3ea',border:'1px solid rgba(255,255,255,.6)',zIndex:2}}>
            {priority}
          </div>
        )}
      </div>
      <span style={{fontSize:subtle?10:11,color:hov?C.coral:(subtle?C.muted:C.text),fontFamily:"'Inter',sans-serif",fontWeight:hov?700:(isPri?600:500),textAlign:'center',lineHeight:1.2,maxWidth:size+20,wordBreak:'break-word',textShadow:'0 1px 4px rgba(248,243,234,.95)',transition:'color .15s',letterSpacing:'-.01em'}}>
        {label}

      {showTip&&(
        <div style={{position:'absolute',bottom:'100%',left:'50%',transform:'translateX(-50%)',marginBottom:8,background:'rgba(26,22,20,.85)',color:'#fff',fontFamily:"'Inter',sans-serif",fontSize:11,fontWeight:500,padding:'5px 12px',borderRadius:8,whiteSpace:'nowrap',pointerEvents:'none',zIndex:99,animation:'fadeUp .2s ease both',boxShadow:'0 4px 12px rgba(0,0,0,.2)'}}>

        </div>
      )}
    </div>
  );
}

  const handleInteract=()=>{};

  /* ── Roadmap icon layout — priority zigzag + optional bottom row ── */
  const VW=Math.max(window.innerWidth,1280);
  const VH=window.innerHeight;
  const PRI_SZ=100;
  const OPT_SZ=78;

  // 8 PRIORITY icons (recruiter must-see): zigzag treasure-map path
  const PAD_L=110;
  const PAD_R=110;
  const TOP_Y=130;
  const ZIG_AMP=170;       // height of the zigzag
  const N_PRI=8;
  const STEP=(VW-PAD_L-PAD_R)/(N_PRI-1);
  const priPos=i=>{
    const x=PAD_L+i*STEP;
    const y=TOP_Y+(i%2===0?0:ZIG_AMP);
    return{x:Math.round(x-(PRI_SZ+24)/2),y:Math.round(y)};
  };
  // Center of each priority icon (for SVG path)
  const priCx=i=>PAD_L+i*STEP;
  const priCy=i=>TOP_Y+(i%2===0?0:ZIG_AMP)+PRI_SZ/2;

  // 3 OPTIONAL icons (curiosités) — bottom row centered
  const OPT_Y=TOP_Y+ZIG_AMP+PRI_SZ+150;
  const N_OPT=3;
  const OPT_GAP=180;
  const OPT_TOTAL=(N_OPT-1)*OPT_GAP;
  const OPT_START=(VW-OPT_TOTAL)/2;
  const optPos=i=>{
    const x=OPT_START+i*OPT_GAP;
    return{x:Math.round(x-(OPT_SZ+24)/2),y:OPT_Y};
  };

  // Build dotted SVG path between consecutive priority icons
  const pathD=Array.from({length:N_PRI-1},(_,i)=>{
    const x1=priCx(i),y1=priCy(i),x2=priCx(i+1),y2=priCy(i+1);
    const mx=(x1+x2)/2;
    return `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
  }).join(' ');

    !showTerminal&&{label:'Terminal',icon:'🖥️',action:()=>setShowTerminal(true)},

    <section id="hero" style={{height:'100vh',position:'relative',overflow:'hidden',paddingTop:28}} className="hero-desktop" onClick={handleInteract}>

      {closedWindows.length>0&&(
        <div style={{position:'absolute',bottom:24,left:'50%',transform:'translateX(-50%)',display:'flex',gap:8,zIndex:30,background:'rgba(255,255,255,.78)',backdropFilter:'blur(20px)',border:`1px solid ${C.border2}`,borderRadius:100,padding:'6px 10px',boxShadow:'0 8px 24px rgba(0,0,0,.08)'}}>
          {closedWindows.map((w,i)=>(
            <button key={i} data-h onClick={w.action} style={{display:'flex',alignItems:'center',gap:5,padding:'4px 12px',background:'none',border:'none',color:C.muted,fontSize:12,cursor:'pointer',borderRadius:100,transition:'background .2s'}} onMouseEnter={e=>e.currentTarget.style.background='rgba(255,107,74,.1)'} onMouseLeave={e=>e.currentTarget.style.background='none'}>
              <span>{w.icon}</span><span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10}}>{w.label}</span>
            </button>
          ))}
        </div>
      )}

      {showTerminal&&<TerminalWindow onClose={()=>setShowTerminal(false)}/>}
      {showSpotify&&<SpotifyWidget onClose={()=>setShowSpotify(false)}/>}
      {showSticky&&<StickyNote onClose={()=>setShowSticky(false)}/>}

      {/* ── ROADMAP — 8 priority icons (zigzag) + 3 optional (bottom) ── */}
      {/* SVG dotted path connecting priority icons (treasure-map style) */}
      <svg style={{position:'absolute',left:0,top:0,width:'100%',height:OPT_Y+OPT_SZ+60,pointerEvents:'none',zIndex:7}} viewBox={`0 0 ${VW} ${OPT_Y+OPT_SZ+60}`} preserveAspectRatio="none">
        <defs>
          <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stopColor="#ff6b4a" stopOpacity="0.7"/>
            <stop offset="50%" stopColor="#ff8a6a" stopOpacity="0.55"/>
            <stop offset="100%" stopColor="#ff6b4a" stopOpacity="0.7"/>
          </linearGradient>
        </defs>
        <path d={pathD} fill="none" stroke="url(#pathGrad)" strokeWidth="3" strokeLinecap="round" strokeDasharray="2 10" style={{animation:'dashFlow 30s linear infinite'}}/>
        {/* Step circles at each priority node */}

}

/* ── APP ─────────────────────────────────────────────── */
function App(){
  const [phase,setPhase]=useState('loader'); // loader → welcome → desktop → done
  const [showTooltip,setShowTooltip]=useState(false);
  return(
    <>
      {phase==='loader'&&<Loader onDone={()=>setPhase('welcome')}/>}
      {phase==='welcome'&&<WelcomeFlow onComplete={()=>{setPhase('desktop');setShowTooltip(true);}}/>}
      <div style={{opacity:phase==='desktop'||phase==='done'?1:0,transition:'opacity .8s ease .1s'}}>
        <HeroSection/>
      </div>
      {showTooltip&&<DesktopTooltip onDismiss={()=>{setShowTooltip(false);setPhase('done');}}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
/* ── PARTICLES (light mode) ─────────────────────────── */
(function(){
  const canvas=document.createElement('canvas');
  canvas.style.cssText='position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.35';
  document.body.appendChild(canvas);
  const ctx=canvas.getContext('2d');
  let W,H,pts=[];
  const resize=()=>{W=canvas.width=innerWidth;H=canvas.height=innerHeight;};
  resize();window.addEventListener('resize',resize);
  const colors=['rgba(255,107,74,','rgba(124,92,231,','rgba(0,135,90,','rgba(232,168,0,'];
  for(let i=0;i<40;i++)pts.push({x:Math.random()*1920,y:Math.random()*1080,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,r:Math.random()*1.2+.3,c:colors[Math.floor(Math.random()*colors.length)],o:Math.random()*.3+.08});
  (function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;
      if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.c+p.o+')';ctx.fill();
    });
    requestAnimationFrame(draw);
  })();
})();
</script>
