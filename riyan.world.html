/* ── HOOKS ───────────────────────────────────────────── */
function useDraggable(init){
  const [pos,setPos]=useState(init);
  const drag=useRef(false);
  const off=useRef({x:0,y:0});
  const onMD=useCallback(e=>{
    if(e.target.closest('.no-drag'))return;
    drag.current=true;
    off.current={x:e.clientX-pos.x,y:e.clientY-pos.y};
    e.preventDefault();
  },[pos]);
  useEffect(()=>{
    const mv=e=>{if(!drag.current)return;setPos({x:e.clientX-off.current.x,y:e.clientY-off.current.y});};
    const up=()=>{drag.current=false;};
    window.addEventListener('mousemove',mv);
    window.addEventListener('mouseup',up);
    return()=>{window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up);};
  },[]);
  return{pos,onMD,setPos};
}

function useInView(ref,threshold=.18){
  const [vis,setVis]=useState(false);
  useEffect(()=>{
    const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting)setVis(true);},{threshold});
    if(ref.current)obs.observe(ref.current);
    return()=>obs.disconnect();
  },[ref,threshold]);
  return vis;
}

function useWindowSize(){
  const [size,setSize]=useState({w:window.innerWidth,h:window.innerHeight});
  useEffect(()=>{
    let t;
    const fn=()=>{clearTimeout(t);t=setTimeout(()=>setSize({w:window.innerWidth,h:window.innerHeight}),80);};
    window.addEventListener('resize',fn);
    return()=>{window.removeEventListener('resize',fn);clearTimeout(t);};
  },[]);
  return size;
}

/* ── DESKTOP TOOLTIP (double-click hint, short) ──────── */
function DesktopTooltip({onDismiss}){
  const [visible,setVisible]=useState(false);
  const [fading,setFading]=useState(false);
  useEffect(()=>{
    const t1=setTimeout(()=>setVisible(true),600);
    const t2=setTimeout(()=>{setFading(true);setTimeout(onDismiss,600)},4000);
    return()=>{clearTimeout(t1);clearTimeout(t2)};
  },[]);
  const dismiss=()=>{setFading(true);setTimeout(onDismiss,400)};
  if(!visible)return null;
  return(
    <div onClick={dismiss} style={{
      position:'fixed',bottom:100,left:'50%',transform:'translateX(-50%)',
      zIndex:7000,background:'rgba(26,22,20,.82)',backdropFilter:'blur(12px)',
      borderRadius:100,padding:'10px 22px',whiteSpace:'nowrap',
      boxShadow:'0 8px 24px rgba(0,0,0,.18)',cursor:'pointer',
      opacity:fading?0:1,transition:'opacity .4s ease',
      animation:'fadeUp .4s ease both',display:'flex',alignItems:'center',gap:10
    }}>
      <span style={{fontSize:15}}>🖱️</span>
      <span style={{fontFamily:"'Inter',sans-serif",fontSize:12,color:'rgba(255,255,255,.9)',fontWeight:500}}>Cliquez sur une icône pour l'ouvrir</span>
    </div>
  );
}

function TerminalWindow({onClose}){
  const {pos,onMD}=useDraggable({x:22,y:62});
  const lines=[
    '$ whoami\n→ Riyan Besseghir · PM & Builder · Toulouse',
    '$ cat status.txt\n→ OPEN TO WORK — CDI / Freelance',
    '$ cat superpower.txt\n→ "Je transforme des frictions en produits."',
    '$ cat mindset.txt\n→ Build fast. Learn faster. Ship real things.',
    '$ echo $ambition\n→ Créer des apps qui améliorent la vie des gens.',
  ];
  const [lineIdx,setLineIdx]=useState(0);
  const [charIdx,setCharIdx]=useState(0);
  const [shown,setShown]=useState(['']);
  const [waiting,setWaiting]=useState(false);
  useEffect(()=>{
    const full=lines[lineIdx];
    if(charIdx<=full.length&&!waiting){
      const t=setTimeout(()=>{setShown(prev=>{const a=[...prev];a[a.length-1]=full.slice(0,charIdx);return a;});setCharIdx(c=>c+1);},charIdx===0?400:30);
      return()=>clearTimeout(t);
    }else if(!waiting){
      setWaiting(true);
      const t=setTimeout(()=>{setLineIdx(i=>(i+1)%lines.length);setCharIdx(0);setShown(p=>[...p.slice(-3),'']);setWaiting(false);},1800);
      return()=>clearTimeout(t);
    }
  },[charIdx,lineIdx,waiting]);
  return(
    <MacWindow title="riyan — bash" style={{width:370,left:pos.x,top:pos.y}} onMD={onMD} onClose={onClose}>
      <div style={{padding:'14px 16px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,lineHeight:1.9,minHeight:148,maxHeight:200,overflow:'hidden',color:C.text}}>
        {shown.map((l,i)=>(
          <div key={i}>{l.split('\n').map((part,j)=>(
            <div key={j} style={{color:j===0?C.coral:C.muted}}>
              {part}{i===shown.length-1&&j===l.split('\n').length-1&&<span style={{display:'inline-block',width:7,height:12,background:C.coral,animation:'blink .7s step-end infinite',verticalAlign:'middle',marginLeft:2}}></span>}
            </div>
          ))}</div>
        ))}
      </div>
    </MacWindow>
  );
}

/* ── BALLOON EASTER EGG ──────────────────────────────── */
function BalloonParticle({b}){
  return(
    <div style={{position:'fixed',left:`${b.x}%`,bottom:-80,zIndex:9999,pointerEvents:'none',animation:`balloonFloat ${b.dur}s ease-out ${b.delay}s both`}}>
      <div style={{animation:`balloonSway 1.${Math.floor(b.dur*3)%9+1}s ease-in-out infinite`,transformOrigin:'bottom center'}}>
        <div style={{width:b.sz,height:Math.round(b.sz*1.25),background:`radial-gradient(circle at 35% 30%,${b.c}ee,${b.c}cc)`,borderRadius:'50% 50% 50% 50% / 60% 60% 40% 40%',position:'relative',boxShadow:`0 3px 12px ${b.c}55,inset 3px -3px 0 rgba(0,0,0,.1),inset -2px 3px 0 rgba(255,255,255,.25)`}}>
          <div style={{position:'absolute',top:'14%',left:'20%',width:'24%',height:'18%',background:'rgba(255,255,255,.45)',borderRadius:'50%'}}/>
          <div style={{position:'absolute',bottom:-5,left:'50%',transform:'translateX(-50%)',width:7,height:7,background:b.c,borderRadius:'50%',boxShadow:`0 2px 4px ${b.c}88`}}/>
        </div>
        <div style={{width:1,height:30,background:`${b.c}77`,margin:'0 auto',marginTop:2}}/>
      </div>
    </div>
  );
}
function BalloonEasterEgg(){
  const [balloons,setBalloons]=useState([]);
  const [popped,setPopped]=useState(false);
  const [hov,setHov]=useState(false);
  const colors=['#ff6b4a','#7c5ce7','#00875a','#e8a800','#6366F1','#FF0050','#22C55E','#0A66C2','#E50914','#F99E1A','#c41e3a','#d4a843'];
  const launch=useCallback(()=>{
    if(popped)return;
    setPopped(true);
    const nb=Array.from({length:18},(_,i)=>({
      id:Date.now()+i,
      x:5+Math.random()*90,
      c:colors[i%colors.length],
      sz:26+Math.floor(Math.random()*18),
      dur:2.4+Math.random()*1.8,
      delay:Math.random()*1.1,
    }));
    setBalloons(prev=>[...prev,...nb]);
    setTimeout(()=>{
      setBalloons(prev=>prev.filter(b=>!nb.find(n=>n.id===b.id)));
      setPopped(false);
    },6000);
  },[popped]);
  useEffect(()=>{
    window.addEventListener('launch-balloons',launch);
    return()=>window.removeEventListener('launch-balloons',launch);
  },[launch]);
  return(
    <>
      {balloons.map(b=><BalloonParticle key={b.id} b={b}/>)}
      <button data-h onClick={e=>{e.stopPropagation();launch();}}

/* ── SKILL 3D CARD ───────────────────────────────────── */
function Skill3DCard({cat}){
  const ref=useRef(null);
  const [tilt,setTilt]=useState({x:0,y:0,active:false});
  const handleMove=useCallback(e=>{
    if(!ref.current)return;
    const r=ref.current.getBoundingClientRect();
    const dx=(e.clientX-r.left-r.width/2)/(r.width/2);
    const dy=(e.clientY-r.top-r.height/2)/(r.height/2);
    setTilt({x:dy*-5,y:dx*5,active:true});
  },[]);
  const handleLeave=()=>setTilt({x:0,y:0,active:false});
  const s=tilt.active;
  return(
    <div ref={ref} onMouseMove={handleMove} onMouseLeave={handleLeave}
      style={{
        background:'#fff',
        border:`1.5px solid ${s?cat.color+'55':'rgba(0,0,0,.07)'}`,
        borderRadius:16,
        overflow:'hidden',
        cursor:'default',
        minHeight:220,
        display:'flex',
        flexDirection:'column',
        transform:`perspective(1200px) rotateX(${tilt.x}deg) rotateY(${tilt.y}deg) ${s?'scale(1.012)':'scale(1)'}`,
        transition:s?'transform .14s ease':'transform .55s cubic-bezier(.22,.68,0,1.2)',
        transformStyle:'preserve-3d',
        boxShadow:s
          ?`0 16px 40px rgba(0,0,0,.09),0 0 0 1px ${cat.color}22,0 4px 14px ${cat.color}18`
          :'0 1px 6px rgba(0,0,0,.04)',
        willChange:'transform',
      }}>
      {/* Color accent top bar */}
      <div style={{height:3,background:`linear-gradient(90deg,${cat.color},${cat.color}66,transparent)`,flexShrink:0}}/>
      <div style={{padding:'18px 20px',flex:1,display:'flex',flexDirection:'column',gap:14}}>
        {/* Header */}
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div style={{
            width:46,height:46,borderRadius:12,
            background:`linear-gradient(135deg,${cat.color}1a,${cat.color}08)`,
            border:`1px solid ${cat.color}28`,
            display:'flex',alignItems:'center',justifyContent:'center',
            fontSize:24,flexShrink:0,
            transition:'box-shadow .3s',
            boxShadow:s?`0 6px 16px ${cat.color}25`:'none',
          }}>{cat.icon}</div>
          <div style={{flex:1}}>
            <div style={{
              fontFamily:"'Space Grotesk',sans-serif",
              fontSize:17,fontWeight:800,
              letterSpacing:'-.03em',
              color:s?cat.color:'#1a1614',
              lineHeight:1.15,
              marginBottom:3,
              transition:'color .3s',
            }}>{cat.cat}</div>
            <div style={{
              fontFamily:"'JetBrains Mono',monospace",
              fontSize:9,letterSpacing:'.1em',fontWeight:600,
              color:C.muted,textTransform:'uppercase',
            }}>{cat.items.length} compétences</div>
          </div>
        </div>
        {/* Bullet list */}
        <div style={{display:'flex',flexDirection:'column',gap:5,flex:1}}>
          {cat.items.map((item,j)=>(
            <div key={item} style={{
              display:'flex',alignItems:'center',gap:8,
              transition:'background .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease',
              transitionDelay:s?`${j*15}ms`:'0ms',

      setTimeout(()=>setCopied(false),2400);

  const [error,setError]=useState('');

      const res=await fetch('https://formsubmit.co/ajax/riyan.besseghir@gmail.com',{
        method:'POST',
        headers:{'Content-Type':'application/json','Accept':'application/json'},

          name:form.name,

          message:form.msg,

          _template:'table'
        })
      });
      const data=await res.json();
      if(data.success==='true'||data.success===true||res.ok){
        setSent(true);setSending(false);
        setTimeout(()=>{setSent(false);setForm({name:'',email:'',msg:''});},5000);
      }else{
        throw new Error(data.message||'Erreur envoi');
      }

      // Fallback: open user's mail client
      const subject=encodeURIComponent(`Portfolio · Message de ${form.name}`);
      const body=encodeURIComponent(`Bonjour Riyan,\n\n${form.msg}\n\n—\nEnvoyé par : ${form.name}\nEmail : ${form.email}`);

              transition:'background .2s,border-color .2s',background:copied?'rgba(0,135,90,.06)':'rgba(248,249,251,.9)',

function DesktopIconPro({children,label,onOpen,pos,size=116,pulse=false,priority=null,subtle=false}){

  const [showTip,setShowTip]=useState(false);
  let tipTimer=useRef(null);
  const handleMouseEnter=()=>{setHov(true);tipTimer.current=setTimeout(()=>setShowTip(true),500);};
  const handleMouseLeave=()=>{setHov(false);clearTimeout(tipTimer.current);setShowTip(false);};
  const isPri=priority!==null;
  return(
    <div onClick={onOpen}
      onMouseEnter={handleMouseEnter} onMouseLeave={handleMouseLeave}
      style={{position:'absolute',left:pos.x,top:pos.y,width:size+24,display:'flex',flexDirection:'column',alignItems:'center',gap:5,userSelect:'none',zIndex:10,borderRadius:14,transition:'background .15s',background:hov?'rgba(255,107,74,.07)':'transparent',opacity:subtle&&!hov?.78:1}}>
      {/* Fixed-height icon wrapper — visual center is at pos.y + size/2 to match SVG path */}
      <div style={{height:size,width:'100%',display:'flex',alignItems:'center',justifyContent:'center',position:'relative'}}>
        <div style={{position:'relative',
          transform:hov?`scale(${(size/100)*1.1}) translateY(-4px)`:`scale(${size/100})`,
          transition:'transform .22s cubic-bezier(.22,.68,0,1.2)',
          filter:hov?'drop-shadow(0 12px 24px rgba(255,107,74,.35))':(isPri?'drop-shadow(0 6px 14px rgba(255,107,74,.28))':'drop-shadow(0 4px 8px rgba(0,0,0,.18))'),
          animation:pulse?'iconPulse 1.8s ease-in-out 3':'none',
          display:'flex',alignItems:'center',justifyContent:'center',lineHeight:1
        }}>
          {children}
          {isPri&&(
            <div style={{position:'absolute',top:-6,right:-6,width:26,height:26,borderRadius:'50%',background:'linear-gradient(135deg,#ff6b4a,#e8553a)',color:'#fff',fontFamily:"'Space Grotesk',sans-serif",fontSize:12,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 12px rgba(255,107,74,.45),0 0 0 2.5px #f8f3ea',border:'1px solid rgba(255,255,255,.6)',zIndex:2}}>
              {priority}
            </div>
          )}
        </div>
      </div>
      <span style={{fontSize:subtle?10:11,color:hov?C.coral:(subtle?C.muted:C.text),fontFamily:"'Inter',sans-serif",fontWeight:hov?700:(isPri?600:500),textAlign:'center',lineHeight:1.2,maxWidth:size+20,wordBreak:'break-word',textShadow:'0 1px 4px rgba(248,243,234,.95)',transition:'color .15s',letterSpacing:'-.01em',marginTop:2}}>

  const [showTerminal,setShowTerminal]=useState(true);
  const [showSpotify,setShowSpotify]=useState(true);
  const [showSticky,setShowSticky]=useState(true);
  const [openRecruteur,setOpenRecruteur]=useState(false);
  const [openChangelog,setOpenChangelog]=useState(false);
  const [pulseActive,setPulseActive]=useState(true);

  // Auto-open Vue Recruteur on landing
  useEffect(()=>{
    const t=setTimeout(()=>setOpenRecruteur(true),900);
    return()=>clearTimeout(t);
  },[]);
  // Stop pulse after 3s
  useEffect(()=>{const t=setTimeout(()=>setPulseActive(false),3000);return()=>clearTimeout(t);},[]);

  const handleInteract=()=>{};

  /* ── Roadmap icon layout — priority zigzag (centered) + optional bottom row ── */
  const {w:VW,h:VH}=useWindowSize();
  const VW_SCALE=Math.max(0.55,Math.min(1,VW/1280));
  const VH_SCALE=Math.max(0.5,Math.min(1,VH/700));
  const SCALE=Math.min(VW_SCALE,VH_SCALE);
  const PRI_SZ=Math.round(100*SCALE);
  const OPT_SZ=Math.round(78*SCALE);
  const EMO_SZ=Math.round(PRI_SZ*0.8);
  const EMO_SZ_OPT=Math.round(OPT_SZ*0.75);

  // 8 PRIORITY icons (recruiter must-see): zigzag treasure-map path — centered vertically
  const PAD_L=Math.round(110*SCALE);
  const PAD_R=Math.round(110*SCALE);
  const ZIG_AMP=Math.round(Math.min(160,VH*0.21)*SCALE);
  // Centre le bloc d'icônes verticalement dans la page
  const TOP_Y=Math.round(Math.max(VH*0.5-(ZIG_AMP+PRI_SZ)*0.5, 70));
  const N_PRI=8;
  const STEP=(VW-PAD_L-PAD_R)/(N_PRI-1);
  const priPos=i=>{
    const x=PAD_L+i*STEP;
    const y=TOP_Y+(i%2===0?0:ZIG_AMP);
    return{x:Math.round(x-(PRI_SZ+24)/2),y:Math.round(y)};
  };
  // Center of each priority icon (for SVG path)
  const priCx=i=>PAD_L+i*STEP;
  const priCy=i=>TOP_Y+(i%2===0?0:ZIG_AMP)+PRI_SZ/2;

  // 3 OPTIONAL icons (curiosités) — bottom row, clamped within viewport
  const OPT_IDEAL=TOP_Y+ZIG_AMP+PRI_SZ+Math.round(60*SCALE);
  const OPT_MAX=VH-OPT_SZ-48;
  const OPT_Y=Math.min(Math.max(OPT_IDEAL,Math.round(VH*0.74)),OPT_MAX);
  const N_OPT=3;
  const OPT_GAP=Math.round(180*SCALE);
  const OPT_TOTAL=(N_OPT-1)*OPT_GAP;
  const OPT_START=(VW-OPT_TOTAL)/2;
  const optPos=i=>{
    const x=OPT_START+i*OPT_GAP;
    return{x:Math.round(x-(OPT_SZ+24)/2),y:OPT_Y};

/* ── DRAG WIN — wraps SectionWindow with internal drag ── */
function DragWin({title,w,h,ix,iy,onClose,children}){
  const rw=Math.min(w,window.innerWidth-40);
  const rh=Math.min(h,window.innerHeight-60);
  const cx=(typeof ix==='number')?ix:Math.max(20,Math.round((window.innerWidth-rw)/2));
  const cy=(typeof iy==='number')?iy:Math.max(40,Math.round((window.innerHeight-rh)/2));
  const {pos,onMD}=useDraggable({x:cx,y:cy});
  return(
    <SectionWindow title={title} style={{width:rw,height:rh,left:pos.x,top:pos.y,zIndex:90}} onMD={onMD} onClose={onClose}>
      {children}
    </SectionWindow>
  );
}

  const btnArrow={position:'absolute',top:'50%',transform:'translateY(-50%)',width:44,height:44,borderRadius:'50%',background:'rgba(0,0,0,.52)',border:'1px solid rgba(255,255,255,.18)',color:'#fff',fontSize:22,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',backdropFilter:'blur(6px)',transition:'background .15s',zIndex:4};
  return(
    <>
    <div style={{position:'fixed',inset:0,zIndex:800,background:'rgba(0,0,0,.72)',backdropFilter:'blur(10px)',display:'flex',alignItems:'center',justifyContent:'center',padding:'20px',animation:'fadeIn .25s ease',overscrollBehavior:'contain'}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:'#17151a',borderRadius:18,width:'100%',maxWidth:880,maxHeight:'92vh',display:'flex',flexDirection:'column',overflow:'hidden',boxShadow:'0 50px 120px rgba(0,0,0,.55)',animation:'fadeUp .3s ease'}}>

        {/* ── macOS titlebar ── */}

          <div style={{width:12,height:12,borderRadius:'50%',background:'#FF5F57',cursor:'pointer',flexShrink:0}} data-h onClick={onClose} aria-label="Fermer"/>
          <div style={{width:12,height:12,borderRadius:'50%',background:'#FFBD2E',flexShrink:0}}/>
          <div style={{width:12,height:12,borderRadius:'50%',background:'#28C840',flexShrink:0}}/>
          <div style={{flex:1,textAlign:'center',fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:'rgba(255,255,255,.4)',letterSpacing:'.06em'}}>{p.name} — Case Study</div>
        </div>

        {/* ── scrollable body ── */}
        <div style={{overflowY:'auto',flex:1}}>

          {/* ── HERO CAROUSEL ── */}
          <div style={{background:'#0d0b10',position:'relative',userSelect:'none'}}>
            {/* Main image */}

              {/* Counter badge */}
              <div style={{position:'absolute',bottom:14,right:16,padding:'4px 11px',background:'rgba(0,0,0,.65)',borderRadius:100,fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:'rgba(255,255,255,.8)',backdropFilter:'blur(6px)',letterSpacing:'.04em'}}>{idx+1} / {shots.length}</div>
              {/* Zoom hint */}
              <div style={{position:'absolute',bottom:14,left:16,padding:'4px 10px',background:'rgba(0,0,0,.55)',borderRadius:100,fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:'rgba(255,255,255,.5)',backdropFilter:'blur(6px)'}}>cliquer pour agrandir</div>

            {/* Prev / Next arrows */}
            {shots.length>1&&(
              <>
                <button aria-label="Précédent" style={{...btnArrow,left:14}} onClick={prev} onMouseEnter={e=>e.currentTarget.style.background='rgba(0,0,0,.8)'} onMouseLeave={e=>e.currentTarget.style.background='rgba(0,0,0,.52)'}>‹</button>
                <button aria-label="Suivant" style={{...btnArrow,right:14}} onClick={next} onMouseEnter={e=>e.currentTarget.style.background='rgba(0,0,0,.8)'} onMouseLeave={e=>e.currentTarget.style.background='rgba(0,0,0,.52)'}>›</button>
              </>
            )}
            {/* ── Thumbnail strip ── */}
            {shots.length>1&&(
              <div style={{display:'flex',gap:8,overflowX:'auto',padding:'12px 16px',background:'#0d0b10',scrollbarWidth:'none'}}>
                {shots.map((s,i)=>(
                  <div key={i} onClick={()=>setIdx(i)} style={{flexShrink:0,width:112,height:70,borderRadius:8,overflow:'hidden',cursor:'pointer',border:`2px solid ${i===idx?p.color:'rgba(255,255,255,.12)'}`,transition:'border-color .18s,transform .18s',transform:i===idx?'scale(1.04)':'scale(1)',background:'#1a1820'}}>
                    <img src={s} alt={`thumb ${i+1}`} style={{width:'100%',height:'100%',objectFit:'cover',opacity:i===idx?1:.65,transition:'opacity .18s'}} onError={e=>e.currentTarget.style.display='none'}/>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* ── Content ── */}
          <div style={{background:'#faf8f4'}}>

            {/* Accent bar — project color thin line */}
            <div style={{height:3,background:`linear-gradient(90deg,${p.color},${p.color}44,transparent)`,flexShrink:0}}/>

            {/* Header */}
            <div style={{padding:'26px 32px 20px',borderBottom:'1px solid rgba(26,22,20,.07)'}}>

                    <span style={{display:'inline-flex',alignItems:'center',gap:5,padding:'4px 10px',background:`${p.color}18`,color:p.color,fontFamily:"'JetBrains Mono',monospace",fontSize:9,borderRadius:6,letterSpacing:'.14em',fontWeight:700,textTransform:'uppercase',border:`1px solid ${p.color}30`}}>{p.badge}</span>

                    <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:C.muted,letterSpacing:'.08em'}}>{p.cat}</span>
                  </div>
                  <h2 style={{fontFamily:"'Space Grotesk',sans-serif",fontSize:26,fontWeight:800,letterSpacing:'-.04em',marginBottom:0,color:C.text,lineHeight:1.1,display:'flex',alignItems:'center',gap:10}}>
                    <span style={{fontSize:28}}>{p.emoji}</span>
                    {p.name}
                  </h2>
                </div>
                <div style={{flexShrink:0,padding:'8px 14px',background:'rgba(26,22,20,.04)',borderRadius:10,border:'1px solid rgba(26,22,20,.07)',textAlign:'right'}}>
                  <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,color:C.muted,letterSpacing:'.12em',textTransform:'uppercase',marginBottom:3}}>Stack</div>
                  <div style={{display:'flex',gap:4,flexWrap:'wrap',justifyContent:'flex-end',maxWidth:200}}>

                      <span key={t} style={{padding:'2px 7px',background:`${p.color}14`,border:`1px solid ${p.color}28`,borderRadius:4,fontFamily:"'JetBrains Mono',monospace",fontSize:8,color:p.color,fontWeight:600,letterSpacing:'.04em'}}>{t}</span>
                    ))}
                    {p.stack.length>4&&<span style={{padding:'2px 7px',background:'rgba(26,22,20,.05)',borderRadius:4,fontFamily:"'JetBrains Mono',monospace",fontSize:8,color:C.muted}}>+{p.stack.length-4}</span>}
                  </div>
                </div>
              </div>

              {/* Tagline as pull quote */}
              <div style={{marginTop:14,paddingLeft:14,borderLeft:`3px solid ${p.color}`,position:'relative'}}>
                <p style={{fontSize:14,color:C.muted,fontStyle:'italic',lineHeight:1.65,margin:0,fontWeight:400}}>"{p.tagline}"</p>
              </div>
            </div>

            {/* Case study sections */}
            <div style={{padding:'22px 32px 0'}}>
              {(()=>{
                const sections=p.sections||[
                  {label:'01 — Problème',text:p.problem,isOutcome:false},
                  {label:'02 — Hypothèse',text:p.hypothesis,isOutcome:false},
                  {label:'03 — Build',text:p.build,isOutcome:false},
                  {label:'04 — Outcome',text:p.outcome,isOutcome:true},
                ];
                const nonOutcome=sections.filter(s=>!s.isOutcome);
                const outcome=sections.find(s=>s.isOutcome);
                return(
                  <>
                    {/* Non-outcome sections — 2-col grid */}
                    <div style={{display:'grid',gridTemplateColumns:nonOutcome.length===1?'1fr':'1fr 1fr',gap:12,marginBottom:12}}>
                      {nonOutcome.map((s,i)=>(
                        <div key={s.label} style={{padding:'16px 18px',background:'#fff',borderRadius:12,border:'1px solid rgba(26,22,20,.07)',boxShadow:'0 1px 3px rgba(26,22,20,.04)',position:'relative',overflow:'hidden'}}>
                          {/* Decorative number */}
                          <div style={{position:'absolute',top:-6,right:10,fontFamily:"'Space Grotesk',sans-serif",fontSize:52,fontWeight:900,color:'rgba(26,22,20,.04)',lineHeight:1,letterSpacing:'-.04em',pointerEvents:'none',userSelect:'none'}}>{String(i+1).padStart(2,'0')}</div>

                          <p style={{fontSize:12,color:C.muted,lineHeight:1.75,margin:0,position:'relative'}}>{s.text}</p>
                        </div>
                      ))}
                    </div>

                    {/* Outcome — full width pull-quote style */}
                    {outcome&&(
                      <div style={{padding:'20px 24px',background:`linear-gradient(135deg,${p.color}12,${p.color}06)`,borderRadius:12,border:`1.5px solid ${p.color}30`,marginBottom:22,position:'relative',overflow:'hidden'}}>

                        </div>
                        <p style={{fontSize:13,color:C.text,lineHeight:1.75,margin:0,fontWeight:600,position:'relative'}}>{outcome.text}</p>
                      </div>

              >→ Voir démo</a>}
              {p.github&&<a href={p.github} target="_blank" rel="noopener noreferrer" data-h style={{display:'inline-flex',alignItems:'center',gap:7,padding:'10px 22px',border:`1.5px solid rgba(26,22,20,.14)`,borderRadius:8,color:C.muted,fontFamily:"'Space Grotesk',sans-serif",fontSize:12,fontWeight:700,textDecoration:'none',cursor:'pointer',transition:'border-color .18s,color .18s,transform .18s',background:'#fff'}}

                onMouseLeave={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.color=C.muted;}}

        </div>

      <div onClick={()=>setLightbox(false)} style={{position:'fixed',inset:0,zIndex:1200,background:'rgba(0,0,0,.92)',backdropFilter:'blur(16px)',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>

          </>

      </div>
    )}
    </>
  );
}

/* ── MOBILE ICON COMPONENT ───────────────────────────── */
function MobIcon({icon,onTap,size=72}){
  const [press,setPress]=useState(false);
  const r=Math.round(size*0.2232);
  const tap=(e)=>{
    const rect=e.currentTarget.getBoundingClientRect();
    setPress(true);
    setTimeout(()=>{setPress(false);onTap(icon,rect);},140);
  };
  const iconEl=ICON_SVG[icon.id]?ICON_SVG[icon.id](size):null;
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:5,cursor:'pointer',userSelect:'none',WebkitTapHighlightColor:'transparent'}} onClick={tap}>
      <div style={{position:'relative',width:size,height:size,borderRadius:r,background:icon.gradient,
        boxShadow:`0 6px 20px rgba(0,0,0,.42),0 2px 6px rgba(0,0,0,.26),inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.2)`,
        display:'flex',alignItems:'center',justifyContent:'center',
        transform:press?'scale(0.86)':'scale(1)',
        transition:'transform .14s cubic-bezier(.22,.68,0,1.2)',
        border:'1px solid rgba(255,255,255,.15)',overflow:'hidden'}}>
        {/* top Liquid Glass shine */}
        <div style={{position:'absolute',top:0,left:0,right:0,height:'52%',background:'linear-gradient(180deg,rgba(255,255,255,.36) 0%,rgba(255,255,255,.05) 100%)',borderRadius:`${r}px ${r}px 0 0`,pointerEvents:'none'}}/>
        {/* bottom ambient glow */}
        <div style={{position:'absolute',bottom:0,left:'10%',right:'10%',height:'28%',background:'radial-gradient(ellipse,rgba(255,255,255,.14) 0%,transparent 70%)',pointerEvents:'none'}}/>
        <div style={{position:'relative',zIndex:1,display:'flex',alignItems:'center',justifyContent:'center',filter:'drop-shadow(0 1px 3px rgba(0,0,0,.35))'}}>
          {iconEl}
        </div>
        {icon.badge&&<div style={{position:'absolute',top:-3,right:-3,width:10,height:10,background:'#ff3b30',borderRadius:'50%',border:'2px solid rgba(8,6,20,.95)',zIndex:2}}/>}
      </div>
      <span style={{fontSize:10,color:'rgba(255,255,255,.92)',fontWeight:500,fontFamily:"-apple-system,'SF Pro Text',sans-serif",textShadow:'0 1px 4px rgba(0,0,0,.6)',letterSpacing:.08,textAlign:'center',maxWidth:size+10,lineHeight:1.2}}>{icon.label}</span>
    </div>
  );
}

/* ── MOBILE WINDOW (iOS 26 zoom from icon) ───────────── */
function MobWindow({title,onClose,children,origin}){
  const [closing,setClosing]=useState(false);
  const close=()=>{setClosing(true);setTimeout(onClose,260);};
  const vw=window.innerWidth;
  const vh=window.innerHeight;
  const cx=origin?`${((origin.left+origin.width/2)/vw*100).toFixed(1)}%`:'50%';
  const cy=origin?`${((origin.top+origin.height/2)/vh*100).toFixed(1)}%`:'50%';
  return(
    <div style={{position:'fixed',inset:0,zIndex:2000,display:'flex',flexDirection:'column',
      transformOrigin:`${cx} ${cy}`,
      animation:closing?'iosClose .26s cubic-bezier(.4,0,1,.5) both':'iosOpen .42s cubic-bezier(.22,.68,0,1.2) both'}}>
      <div style={{position:'absolute',inset:0,background:'rgba(242,242,247,1)'}}/>
      <div style={{position:'relative',zIndex:1,display:'flex',flexDirection:'column',height:'100%'}}>
        <div style={{padding:'56px 20px 10px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:'1px solid rgba(60,60,67,.12)',background:'rgba(249,249,251,.96)',backdropFilter:'blur(20px)',WebkitBackdropFilter:'blur(20px)',flexShrink:0}}>
          <button onClick={close} style={{display:'flex',alignItems:'center',gap:1,border:'none',background:'none',color:'#007AFF',fontSize:17,fontFamily:"-apple-system,'SF Pro Text',sans-serif",fontWeight:400,cursor:'pointer',padding:'4px 0',WebkitTapHighlightColor:'transparent'}}>
            <svg width="10" height="17" viewBox="0 0 10 17" fill="none" style={{marginRight:2}}><path d="M8.5 1.5L1.5 8.5L8.5 15.5" stroke="#007AFF" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
            Retour
          </button>
          <span style={{fontFamily:"-apple-system,'SF Pro Text',sans-serif",fontSize:17,fontWeight:600,color:'#1c1c1e',letterSpacing:-.3}}>{title}</span>
          <div style={{width:64}}/>
        </div>
        <div style={{flex:1,overflowY:'auto',overflowX:'hidden'}} className="mob-scroll">{children}</div>
      </div>
    </div>
  );
}

            <input required type="email" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))} placeholder="Email" style={inp}/>
            <textarea required value={form.msg} onChange={e=>setForm(f=>({...f,msg:e.target.value}))} placeholder="Votre message..." rows={5} style={{...inp,resize:'vertical',minHeight:110}}/>
            {error&&<div style={{fontSize:11,color:'#b34a2a',background:'rgba(255,107,74,.08)',border:'1px solid rgba(255,107,74,.25)',borderRadius:8,padding:'8px 12px',lineHeight:1.5}}>⚠ {error}</div>}
            <button type="submit" data-h disabled={sending} style={{padding:'13px 24px',background:sending?'#5b5048':C.coral,color:'#fff',border:'none',borderRadius:100,fontFamily:"'Space Grotesk',sans-serif",fontSize:14,fontWeight:700,boxShadow:'0 4px 18px rgba(255,107,74,.3)'}}>
              {sending?'Envoi...':'Envoyer →'}
            </button>
          </form>
        )}
      </div>
    </div>
  );
}

/* ── MOBILE PARCOURS ─────────────────────────────────────── */
function MobParcoursContent(){
  const [active,setActive]=React.useState(null);
  return(
    <div style={{padding:20}}>
      <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:C.coral,letterSpacing:'.18em',textTransform:'uppercase',marginBottom:8}}>Parcours · 2007 → 2026</div>
      <h2 style={{fontFamily:"'Space Grotesk',sans-serif",fontSize:22,fontWeight:800,letterSpacing:'-.04em',marginBottom:6,color:'#1a1614'}}>Mon <span style={{color:C.coral}}>histoire</span></h2>
      <p style={{fontSize:12,color:'#5b5048',lineHeight:1.6,marginBottom:18}}>Appuyez sur une étape pour voir le détail.</p>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {TL_EVENTS.map((e,i)=>{
          const isA=active===i;
          return(
            <div key={i} data-h onClick={()=>setActive(isA?null:i)} style={{background:isA?'#fff':'rgba(248,249,251,.9)',border:`1.5px solid ${isA?e.color+'55':'rgba(0,0,0,.07)'}`,borderRadius:14,overflow:'hidden',boxShadow:isA?`0 8px 24px rgba(0,0,0,.08),0 0 0 1px ${e.color}22`:'none',cursor:'pointer',transition:'background .25s,border-color .25s,box-shadow .25s'}}>
              <div style={{padding:'14px 16px',display:'flex',alignItems:'center',gap:12}}>
                <div style={{width:44,height:44,borderRadius:'50%',background:isA?e.color:'#fff',border:`2.5px solid ${e.color}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0,boxShadow:isA?`0 6px 18px ${e.color}55`:'0 2px 8px rgba(0,0,0,.08)',transition:'background .25s,box-shadow .25s'}}>{e.emoji}</div>
                <div style={{flex:1}}>
                  <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:e.color,fontWeight:800,letterSpacing:'.04em',marginBottom:2}}>{e.year}</div>
                  <div style={{fontSize:14,fontWeight:800,color:'#1a1614',fontFamily:"'Space Grotesk',sans-serif",letterSpacing:'-.02em'}}>{e.title}</div>
                </div>
                <span style={{fontSize:12,color:e.color,fontFamily:"'JetBrains Mono',monospace",fontWeight:700,transition:'transform .25s',transform:isA?'rotate(180deg)':'rotate(0deg)'}}>▼</span>
              </div>
              {isA&&<div style={{padding:'0 16px 14px'}}>
                <p style={{fontSize:13,color:'#5b5048',lineHeight:1.65,margin:'0 0 10px'}}>{e.text}</p>
                <p style={{fontSize:12,color:'#5b5048',lineHeight:1.75,margin:0,padding:'12px 14px',background:`${e.color}10`,borderRadius:10,borderLeft:`2.5px solid ${e.color}`}}>{e.detail}</p>
              </div>}

          );
        })}

    case 'parcours': return <MobParcoursContent/>;
    case 'impact':   return <MobImpactContent/>;

    case 'tiktok':   return <MobTikTokContent/>;

/* ── MOBILE APP (iOS 26 Liquid Glass) ───────────────── */
function MobileApp(){
  const [open,setOpen]=useState(null);
  const [openRect,setOpenRect]=useState(null);
  const openIcon=open?MOB_ICONS.find(i=>i.id===open):null;
  const now=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  const openApp=(icon,rect)=>{setOpen(icon.id);setOpenRect(rect);};

  return(
    <div style={{position:'fixed',inset:0,overflow:'hidden',fontFamily:"'-apple-system','SF Pro Text','Inter',sans-serif"}}>
      {/* Wallpaper — iOS 26 deep space */}
      <div style={{position:'absolute',inset:0,background:'linear-gradient(170deg,#06040f 0%,#0a0c1e 25%,#0e1232 50%,#080a1a 75%,#050408 100%)'}}>
        {/* Aurora glow top-left — purple */}
        <div style={{position:'absolute',width:'150vw',height:'120vw',borderRadius:'50%',background:'radial-gradient(ellipse,rgba(88,50,210,.22) 0%,rgba(60,30,160,.08) 40%,transparent 68%)',top:'-60%',left:'-25%',filter:'blur(60px)'}}/>
        {/* Aurora glow bottom-right — indigo */}
        <div style={{position:'absolute',width:'100vw',height:'100vw',borderRadius:'50%',background:'radial-gradient(ellipse,rgba(26,80,200,.15) 0%,rgba(16,50,140,.05) 50%,transparent 70%)',bottom:'-40%',right:'-20%',filter:'blur(50px)'}}/>
        {/* Subtle mid cyan accent */}
        <div style={{position:'absolute',width:'60vw',height:'60vw',borderRadius:'50%',background:'radial-gradient(ellipse,rgba(0,180,255,.07) 0%,transparent 65%)',top:'30%',right:'5%',filter:'blur(40px)'}}/>
        {/* Grain overlay via SVG — iOS wallpaper texture */}
        <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',opacity:.045}} xmlns="http://www.w3.org/2000/svg">
          <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
          <rect width="100%" height="100%" filter="url(#grain)"/>
        </svg>
      </div>

      {/* UI */}
      <div style={{position:'relative',zIndex:1,height:'100%',display:'flex',flexDirection:'column'}}>
        {/* Status bar — iOS 26 */}
        <div style={{padding:'14px 24px 4px',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
          <span style={{color:'#fff',fontSize:15,fontWeight:700,letterSpacing:.1,fontVariantNumeric:'tabular-nums'}}>{now}</span>
          <div style={{display:'flex',gap:6,alignItems:'center'}}>
            {/* Signal bars */}
            <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
              <rect x="0" y="5" width="3" height="7" rx="1" fill="white" opacity=".35"/>
              <rect x="4.5" y="3" width="3" height="9" rx="1" fill="white" opacity=".6"/>
              <rect x="9" y="1" width="3" height="11" rx="1" fill="white" opacity=".8"/>
              <rect x="13.5" y="0" width="3" height="12" rx="1" fill="white"/>
            </svg>
            {/* WiFi */}
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
              <path d="M8 10.5L8 10.5" stroke="white" strokeWidth="2" strokeLinecap="round"/>
              <path d="M5.5 8C6.3 7.1 7.1 6.6 8 6.6C8.9 6.6 9.7 7.1 10.5 8" stroke="white" strokeWidth="1.5" strokeLinecap="round" fill="none"/>
              <path d="M3 5.5C4.5 3.8 6.2 2.8 8 2.8C9.8 2.8 11.5 3.8 13 5.5" stroke="white" strokeWidth="1.5" strokeLinecap="round" fill="none" opacity=".7"/>
              <path d="M0.5 3C2.8 0.8 5.3 0 8 0C10.7 0 13.2 0.8 15.5 3" stroke="white" strokeWidth="1.5" strokeLinecap="round" fill="none" opacity=".4"/>
            </svg>
            {/* Battery */}
            <svg width="27" height="13" viewBox="0 0 27 13" fill="none">
              <rect x="0.5" y="1" width="23" height="11" rx="3" stroke="white" strokeOpacity=".38" strokeWidth="1"/>
              <rect x="1.5" y="2" width="18" height="9" rx="2" fill="white"/>
              <rect x="24.5" y="4.5" width="2" height="4" rx="1" fill="white" opacity=".38"/>
            </svg>
          </div>
        </div>

        {/* Non-scrollable home — fixed flex column */}
        <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column',padding:'6px 20px 0'}}>
          {/* Hero bento widget — compact */}
          <div style={{marginBottom:10,padding:'10px 14px',borderRadius:18,background:'rgba(255,255,255,.08)',backdropFilter:'blur(28px)',border:'1px solid rgba(255,255,255,.14)',boxShadow:'0 8px 32px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.18)',position:'relative',overflow:'hidden',flexShrink:0}}>
            <div style={{position:'absolute',top:0,left:0,right:0,height:'48%',background:'linear-gradient(180deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.01) 100%)',borderRadius:'18px 18px 0 0',pointerEvents:'none'}}/>
            <div style={{position:'relative',zIndex:1}}>
              <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,color:'rgba(255,255,255,.45)',letterSpacing:'.2em',textTransform:'uppercase',marginBottom:4}}>riyan.world · PM & Product Builder</div>
              <h1 style={{fontFamily:"'Space Grotesk',sans-serif",fontSize:15,fontWeight:800,color:'#fff',lineHeight:1.2,letterSpacing:'-.03em',margin:'0 0 7px'}}>
                Je transforme des <span style={{color:'#b8a0ff'}}>frictions</span> en produits
              </h1>
              <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
                {['PM','Builder','Toulouse','IA'].map(t=>(
                  <span key={t} style={{padding:'2px 7px',borderRadius:100,background:'rgba(255,255,255,.09)',border:'1px solid rgba(255,255,255,.13)',fontSize:9,color:'rgba(255,255,255,.68)',fontFamily:"'JetBrains Mono',monospace"}}>{t}</span>
                ))}
              </div>
            </div>
          </div>

          {/* Icon grid 4 cols — toutes les apps */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'18px 8px',justifyItems:'center',flexShrink:0,padding:'4px 0'}}>
            {MOB_ICONS.map(icon=><MobIcon key={icon.id} icon={icon} onTap={openApp} size={60}/>)}
          </div>
        </div>

        {/* Dock — iOS 26 Liquid Glass */}
        <div style={{margin:'8px 16px 36px',padding:'14px 18px',borderRadius:32,
          background:'rgba(255,255,255,.11)',
          backdropFilter:'blur(48px) saturate(180%)',
          WebkitBackdropFilter:'blur(48px) saturate(180%)',
          border:'1px solid rgba(255,255,255,.20)',
          display:'flex',justifyContent:'space-around',alignItems:'flex-start',flexShrink:0,
          boxShadow:'0 12px 40px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.22),inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(0,0,0,.12)',
          position:'relative',overflow:'hidden'}}>
          {/* Dock glass top shine */}
          <div style={{position:'absolute',top:0,left:0,right:0,height:'52%',background:'linear-gradient(180deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.02) 100%)',borderRadius:'32px 32px 0 0',pointerEvents:'none'}}/>
          {/* Dock inner side sheen */}
          <div style={{position:'absolute',inset:0,borderRadius:32,background:'radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.08) 0%,transparent 60%)',pointerEvents:'none'}}/>
          {MOB_DOCK.map(icon=><MobIcon key={icon.id} icon={icon} onTap={openApp} size={58}/>)}
        </div>
      </div>

      {/* Window overlay */}
      {open&&openIcon&&(
        <MobWindow title={MOB_TITLES[open]||open} onClose={()=>{setOpen(null);setOpenRect(null);}} origin={openRect}>
          <MobContent id={open}/>
        </MobWindow>
      )}
    </div>
  );
}

/* ── DESKTOP APP ─────────────────────────────────────── */
function DesktopApp(){
  const [phase,setPhase]=useState('loader');
  const [showTooltip,setShowTooltip]=useState(false);
  return(
    <>
      {phase==='loader'&&<Loader onDone={()=>setPhase('welcome')}/>}
      {phase==='welcome'&&<WelcomeFlow onComplete={()=>{setPhase('desktop');setShowTooltip(true);}}/>}
      <div style={{opacity:phase==='desktop'||phase==='done'?1:0,transition:'opacity .8s ease .1s'}}>
        <HeroSection/>
      </div>
      {showTooltip&&<DesktopTooltip onDismiss={()=>{setShowTooltip(false);setPhase('done');}}/>}
    </>
  );
}

function App(){
  return IS_MOBILE?<MobileApp/>:<DesktopApp/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script src="assets/particles.js"></script>
</body>
